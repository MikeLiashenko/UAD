<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukraine Air Defense</title>
<meta name="description" content="Нічне чергування ППО над Києвом, Харковом, Дніпром та Одесою. Завантажити для Windows та Android.">
<meta name="theme-color" content="#020807">
<meta property="og:title" content="Ukraine Air Defense">
<meta property="og:description" content="Нічне чергування ППО над Києвом, Харковом, Дніпром та Одесою. Windows · Android · кооператив.">

<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root {
	--bg: #020807;
	--bg2: #041310;
	--panel: rgba(5, 28, 21, 0.72);
	--panel2: rgba(8, 40, 30, 0.82);
	--line: rgba(51, 255, 166, 0.22);
	--line2: rgba(51, 255, 166, 0.5);
	--neon: #33ffa6;
	--cyan: #5ad8ff;
	--amber: #ffbf40;
	--red: #ff5a4a;
	--text: #dcffee;
	--muted: #8fbfaa;
	--dim: #5d8a78;
	--radius: 14px;
	--display: "Russo One", "Manrope", system-ui, sans-serif;
	--body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
	margin: 0;
	background: var(--bg);
	color: var(--text);
	font: 16px/1.6 var(--body);
	-webkit-font-smoothing: antialiased;
	overflow-x: hidden;
}
a { color: var(--neon); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; display: block; }
.wrap { width: min(1180px, 100% - 32px); margin: 0 auto; }

/* --- navigation ------------------------------------------------------------ */
.nav {
	position: fixed; inset: 0 0 auto 0; z-index: 20;
	backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
	background: linear-gradient(to bottom, rgba(2, 8, 7, 0.92), rgba(2, 8, 7, 0.6));
	border-bottom: 1px solid var(--line);
}
.nav .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font: 20px var(--display); letter-spacing: 1px; }
.brand:hover { text-decoration: none; }
.brand img { width: 34px; height: 34px; border-radius: 8px; box-shadow: 0 0 14px rgba(51, 255, 166, 0.35); }
.nav .links { display: flex; gap: 22px; margin-left: auto; }
.nav .links a { color: var(--muted); font-weight: 600; font-size: 15px; }
.nav .links a:hover { color: var(--neon); text-decoration: none; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button {
	background: none; border: 0; color: var(--muted); font: 700 12px var(--body);
	padding: 6px 10px; cursor: pointer; letter-spacing: 0.5px;
}
.lang button.on { background: var(--neon); color: #01140c; }
@media (max-width: 820px) { .nav .links { display: none; } .lang { margin-left: auto; } }

/* --- hero ---------------------------------------------------------------------- */
.hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; padding: 96px 0 56px; overflow: hidden; }
#radar { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.9; }
.hero::after {
	content: ""; position: absolute; inset: 0; pointer-events: none;
	background:
		radial-gradient(ellipse at 70% 45%, transparent 0%, rgba(2, 8, 7, 0.35) 55%, var(--bg) 100%),
		repeating-linear-gradient(to bottom, rgba(51, 255, 166, 0.035) 0 1px, transparent 1px 4px);
}
.hero .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
@media (max-width: 980px) { .hero .wrap { grid-template-columns: 1fr; } }
.kicker {
	display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
	border: 1px solid var(--line2); color: var(--neon); font-weight: 700; font-size: 13px;
	letter-spacing: 1.5px; text-transform: uppercase; background: rgba(51, 255, 166, 0.06);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
h1 {
	margin: 18px 0 14px; font: clamp(42px, 7vw, 86px)/0.95 var(--display); letter-spacing: 1px;
	color: #eafff4;
	text-shadow: 0 0 18px rgba(51, 255, 166, 0.55), 0 0 60px rgba(51, 255, 166, 0.25);
}
h1 span { display: block; color: var(--neon); }
.tagline { font-size: clamp(17px, 2vw, 20px); color: var(--muted); max-width: 560px; margin: 0 0 28px; }
.cta { display: flex; flex-wrap: wrap; gap: 14px; }
.btn {
	display: inline-flex; align-items: center; gap: 14px; padding: 14px 22px 14px 18px; border-radius: 12px;
	border: 1px solid var(--line2); background: var(--panel2); color: var(--text); min-width: 250px;
	transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.btn:hover { text-decoration: none; transform: translateY(-2px); border-color: var(--neon); box-shadow: 0 8px 30px rgba(51, 255, 166, 0.18); }
.btn svg { width: 30px; height: 30px; flex: none; }
.btn b { display: block; font: 17px var(--display); letter-spacing: 0.5px; }
.btn small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
.btn.primary { background: linear-gradient(135deg, #33ffa6, #1fd28a); color: #012112; border-color: transparent; box-shadow: 0 0 30px rgba(51, 255, 166, 0.35); }
.btn.primary small { color: rgba(1, 33, 18, 0.75); }
.btn.primary:hover { box-shadow: 0 10px 40px rgba(51, 255, 166, 0.5); }
.buildline { margin-top: 18px; color: var(--dim); font-size: 14px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.buildline .tag { color: var(--neon); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.shotframe {
	position: relative; border-radius: 16px; padding: 8px; background: linear-gradient(145deg, rgba(51, 255, 166, 0.5), rgba(90, 216, 255, 0.15) 40%, rgba(51, 255, 166, 0.05));
	box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(51, 255, 166, 0.15);
	transform: perspective(1400px) rotateY(-9deg) rotateX(3deg);
}
.shotframe img, .shotframe .ph { border-radius: 10px; aspect-ratio: 16 / 9; width: 100%; object-fit: cover; background: #06140f; }
.shotframe .hud {
	position: absolute; left: 22px; bottom: 20px; right: 22px; display: flex; justify-content: space-between;
	font: 700 12px var(--body); letter-spacing: 1.5px; color: var(--neon); text-shadow: 0 0 8px #000;
}
@media (max-width: 980px) { .shotframe { transform: none; } }

/* --- sections ------------------------------------------------------------------ */
section { padding: 96px 0; position: relative; }
.sec-title { font: clamp(30px, 4vw, 44px)/1.1 var(--display); margin: 0 0 12px; letter-spacing: 0.5px; }
.sec-sub { color: var(--muted); max-width: 680px; margin: 0 0 44px; font-size: 18px; }
.grid-bg {
	background:
		linear-gradient(var(--bg2), var(--bg2)) padding-box,
		linear-gradient(90deg, rgba(51, 255, 166, 0.05) 1px, transparent 1px) 0 0 / 48px 48px,
		linear-gradient(rgba(51, 255, 166, 0.05) 1px, transparent 1px) 0 0 / 48px 48px;
	background-blend-mode: normal;
}
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 980px) { .features { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .features { grid-template-columns: 1fr; } }
.card {
	background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px;
	transition: border-color 0.2s, transform 0.2s;
}
.card:hover { border-color: var(--line2); transform: translateY(-3px); }
.card .ic {
	width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 16px;
	background: rgba(51, 255, 166, 0.1); border: 1px solid var(--line); color: var(--neon);
}
.card .ic svg { width: 26px; height: 26px; }
.card h3 { margin: 0 0 8px; font: 20px var(--display); letter-spacing: 0.3px; }
.card p { margin: 0; color: var(--muted); }

.gallery { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.gallery figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); cursor: zoom-in; background: #06140f; }
.gallery figure:nth-child(1) { grid-column: span 4; grid-row: span 2; }
.gallery figure { grid-column: span 2; }
.gallery img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 16 / 9; transition: transform 0.4s; }
.gallery figure:hover img { transform: scale(1.04); }
.gallery figcaption {
	position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 10px; font-weight: 700; font-size: 14px;
	background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
}
@media (max-width: 820px) { .gallery { grid-template-columns: 1fr 1fr; } .gallery figure, .gallery figure:nth-child(1) { grid-column: span 2; grid-row: auto; } }

.coop { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
@media (max-width: 980px) { .coop { grid-template-columns: 1fr; } }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 14px; }
.steps li {
	counter-increment: s; position: relative; padding: 16px 18px 16px 70px; background: var(--panel);
	border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted);
}
.steps li b { color: var(--text); display: block; font-size: 17px; }
.steps li::before {
	content: counter(s); position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
	width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
	font: 17px var(--display); color: #012112; background: var(--neon); box-shadow: 0 0 16px rgba(51, 255, 166, 0.5);
}
.codebox {
	background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--radius); padding: 26px; text-align: center;
	box-shadow: 0 0 50px rgba(51, 255, 166, 0.1);
}
.codebox .label { color: var(--muted); font-weight: 700; letter-spacing: 1.5px; font-size: 13px; text-transform: uppercase; }
.codebox .code { font: clamp(34px, 6vw, 52px) var(--display); letter-spacing: 6px; color: var(--neon); text-shadow: 0 0 22px rgba(51, 255, 166, 0.6); margin: 8px 0 18px; }
.request {
	display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: wrap; padding: 14px; border-radius: 10px;
	border: 1px solid rgba(90, 216, 255, 0.5); background: rgba(0, 20, 28, 0.7); color: var(--text); font-weight: 600;
}
.pill { padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 14px; border: 1px solid var(--line2); }
.pill.yes { color: var(--neon); }
.pill.no { color: var(--muted); }

.dl { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 820px) { .dl { grid-template-columns: 1fr; } }
.dlcard { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.dlcard.hot { border-color: var(--line2); box-shadow: 0 0 40px rgba(51, 255, 166, 0.1); }
.dlcard header { display: flex; align-items: center; gap: 14px; }
.dlcard header svg { width: 40px; height: 40px; color: var(--neon); }
.dlcard h3 { margin: 0; font: 24px var(--display); }
.dlcard .meta { color: var(--muted); font-size: 14px; font-weight: 600; }
.dlcard ol { margin: 0; padding-left: 20px; color: var(--muted); }
.dlcard ol li { margin: 4px 0; }
.dlcard .btn { justify-content: center; width: 100%; }
.note { margin-top: 22px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
.note svg { width: 20px; height: 20px; flex: none; color: var(--amber); margin-top: 3px; }

.builds { display: grid; gap: 12px; }
.build {
	display: grid; grid-template-columns: 140px 120px 1fr; gap: 16px; align-items: baseline; padding: 16px 20px;
	background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
}
.build .n { font: 18px var(--display); color: var(--neon); }
.build .d { color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
.build .t { color: var(--muted); white-space: pre-line; }
.build.latest { border-color: var(--line2); }
@media (max-width: 620px) { .build { grid-template-columns: 1fr; gap: 4px; } }
.empty { color: var(--dim); }

footer { border-top: 1px solid var(--line); padding: 34px 0 44px; color: var(--dim); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between; }

.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.92); display: none; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox.on { display: grid; }
.lightbox img { max-height: 90vh; border-radius: 10px; border: 1px solid var(--line2); box-shadow: 0 0 60px rgba(51, 255, 166, 0.2); }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.7s, transform 0.7s; }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
	.reveal { opacity: 1; transform: none; transition: none; }
	.dot { animation: none; }
	html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<nav class="nav">
	<div class="wrap">

	<div class="wrap">
		<div>
			<span class="kicker"><span class="dot"></span><span data-i18n="kicker"></span></span>

					<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.1 10.4 4v7.2H3V5.1Zm0 13.8 7.4 1.1v-7.1H3v6Zm8.3 1.2L21 21.5V12.9h-9.7v7.2Zm0-16.2v7.3H21V2.5l-9.7 1.4Z"/></svg>

</header>

<section id="features" class="grid-bg">
	<div class="wrap">
		<h2 class="sec-title reveal" data-i18n="features_t"></h2>
		<p class="sec-sub reveal" data-i18n="features_s"></p>
		<div class="features">
			<article class="card reveal"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l4-3v15M9 21V4l6 3v14M15 21V11l4 2v8"/></svg></div><h3 data-i18n="f1_t"></h3><p data-i18n="f1"></p></article>
			<article class="card reveal"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M8 6l4-4 4 4M5 22l7-9 7 9M9 17h6"/></svg></div><h3 data-i18n="f2_t"></h3><p data-i18n="f2"></p></article>
			<article class="card reveal"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l7-2 4-7 2 1-2 7 7 1v2l-7 1 2 7-2 1-4-7-7-2z"/></svg></div><h3 data-i18n="f3_t"></h3><p data-i18n="f3"></p></article>
			<article class="card reveal"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 7c-3 3-5 6-5 9a5 5 0 0 0 10 0c0-3-2-6-5-9zM4 21c2-1 4-1 6 0s4 1 6 0 4-1 4 0"/></svg></div><h3 data-i18n="f4_t"></h3><p data-i18n="f4"></p></article>
			<article class="card reveal"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg></div><h3 data-i18n="f5_t"></h3><p data-i18n="f5"></p></article>
			<article class="card reveal"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5M12 20c0-3 2-5 4-5s6 2 6 5"/></svg></div><h3 data-i18n="f6_t"></h3><p data-i18n="f6"></p></article>
		</div>
	</div>
</section>

<section id="shots">
	<div class="wrap">
		<h2 class="sec-title reveal" data-i18n="shots_t"></h2>
		<p class="sec-sub reveal" data-i18n="shots_s"></p>

			<figure class="reveal"><img loading="lazy" src="img/shot-1.jpg" alt=""><figcaption data-i18n="s1"></figcaption></figure>

			<figure class="reveal"><img loading="lazy" src="img/shot-5.jpg" alt=""><figcaption data-i18n="s5"></figcaption></figure>

<section id="coop" class="grid-bg">
	<div class="wrap coop">
		<div>
			<h2 class="sec-title reveal" data-i18n="coop_t"></h2>
			<p class="sec-sub reveal" data-i18n="coop_s"></p>
			<ol class="steps">
				<li class="reveal"><b data-i18n="c1_t"></b><span data-i18n="c1"></span></li>
				<li class="reveal"><b data-i18n="c2_t"></b><span data-i18n="c2"></span></li>
				<li class="reveal"><b data-i18n="c3_t"></b><span data-i18n="c3"></span></li>
				<li class="reveal"><b data-i18n="c4_t"></b><span data-i18n="c4"></span></li>
			</ol>
		</div>
		<div class="codebox reveal">
			<div class="label" data-i18n="code_label"></div>
			<div class="code">K7MQ-4XRT</div>

		</div>
	</div>
</section>

<section id="download">
	<div class="wrap">
		<h2 class="sec-title reveal" data-i18n="dl_t"></h2>
		<p class="sec-sub reveal" data-i18n="dl_s"></p>

let lang = "uk";
let release = null;
let releases = null;

function pickLang() {
	try { const s = localStorage.getItem("uad-lang"); if (s && T[s]) return s; } catch (e) {}
	const n = (navigator.language || "uk").slice(0, 2).toLowerCase();
	return n === "ru" ? "ru" : (n === "en" ? "en" : "uk");
}

function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k; }

function applyLang() {
	document.documentElement.lang = lang;
	document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
	document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
	renderRelease();
	renderBuilds();
}

document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
	lang = b.dataset.lang;
	try { localStorage.setItem("uad-lang", lang); } catch (e) {}
	applyLang();
}));

function fmtDate(s) {
	if (!s) return "";
	const d = new Date(s);
	if (isNaN(d)) return s;
	return d.toLocaleDateString(lang === "uk" ? "uk-UA" : lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function trusted(url) {
	return typeof url === "string" && url.startsWith("https://github.com/" + REPO + "/releases/");
}

function renderRelease() {
	const tag = document.getElementById("build-tag");
	if (!release) { tag.textContent = t("build") + " —"; return; }
	tag.textContent = t("build") + " " + (parseInt(release.build, 10) || "—") + " · v" + String(release.version || "").slice(0, 16);
	document.getElementById("build-date").textContent = fmtDate(String(release.date || "").slice(0, 10));
	const winMeta = ".exe" + (+release.exe_mb ? " · " + (+release.exe_mb) + " " + t("mb") : "");
	const apkMeta = ".apk" + (+release.apk_mb ? " · " + (+release.apk_mb) + " " + t("mb") : "");
	["win-meta", "win-meta2"].forEach((id) => document.getElementById(id).textContent = winMeta);
	["apk-meta", "apk-meta2"].forEach((id) => document.getElementById(id).textContent = apkMeta);
	// the database only picks the file: anything but this repo's releases keeps the default link
	if (trusted(release.exe)) ["btn-win", "btn-win2"].forEach((id) => document.getElementById(id).href = release.exe);
	if (trusted(release.apk)) ["btn-apk", "btn-apk2"].forEach((id) => document.getElementById(id).href = release.apk);
}

function renderBuilds() {
	const box = document.getElementById("build-list");
	if (releases === null) return;
	if (!releases.length) { box.innerHTML = '<div class="empty">' + t("none") + "</div>"; return; }
	box.innerHTML = "";
	releases.forEach((r, i) => {
		const row = document.createElement("div");
		row.className = "build" + (i === 0 ? " latest" : "");
		const n = document.createElement("div"); n.className = "n"; n.textContent = (r.name || r.tag_name).replace(/^UAD · /, "");
		const d = document.createElement("div"); d.className = "d"; d.textContent = fmtDate(r.published_at);
		const tx = document.createElement("div"); tx.className = "t";
		tx.textContent = (r.body || "").split("\n").filter((l) => l.trim() && !/^(\*\*Windows|Сайт:|Site:)/.test(l.trim())).slice(0, 4).join("\n");
		row.append(n, d, tx);
		box.append(row);
	});
}

async function load(url, ms) {
	const c = new AbortController();
	const timer = setTimeout(() => c.abort(), ms);
	try { const r = await fetch(url, { signal: c.signal, cache: "no-store" }); return r.ok ? await r.json() : null; }
	catch (e) { return null; }
	finally { clearTimeout(timer); }
}

(async () => {
	const r = await load(DB, 7000);
	if (r && r.build) release = r;
	renderRelease();
})();
(async () => {
	const r = await load("https://api.github.com/repos/" + REPO + "/releases?per_page=6", 8000);
	releases = Array.isArray(r) ? r : [];
	renderBuilds();
})();

const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => {
	if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }

// the radar behind the title: a sweeping beam, threats closing in, interceptors going up
(() => {
	const cv = document.getElementById("radar");
	const ctx = cv.getContext("2d");
	const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
	let w, h, cx, cy, R, dpr;
	const blips = [];
	const shots = [];
	function resize() {
		dpr = Math.min(window.devicePixelRatio || 1, 2);
		w = cv.clientWidth; h = cv.clientHeight;
		cv.width = w * dpr; cv.height = h * dpr;
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		cx = w > 980 ? w * 0.74 : w * 0.5; cy = h * 0.5;
		R = Math.max(w, h) * 0.55;
	}
	function spawn() {
		const a = Math.random() * Math.PI * 2;
		const kind = Math.random() < 0.72 ? 0 : (Math.random() < 0.7 ? 1 : 2);
		blips.push({ a, r: R * (0.9 + Math.random() * 0.2), v: [14, 34, 70][kind] * (0.8 + Math.random() * 0.4), kind, seen: 0, alive: true });
	}
	for (let i = 0; i < 9; i++) { spawn(); blips[i].r = R * (0.25 + Math.random() * 0.7); }
	let sweep = 0, last = performance.now();
	function frame(now) {
		const dt = Math.min((now - last) / 1000, 0.05); last = now;
		sweep = (sweep + dt * 1.25) % (Math.PI * 2);
		ctx.clearRect(0, 0, w, h);
		ctx.strokeStyle = "rgba(51,255,166,0.12)"; ctx.lineWidth = 1;
		for (let k = 1; k <= 6; k++) { ctx.beginPath(); ctx.arc(cx, cy, R * k / 6, 0, Math.PI * 2); ctx.stroke(); }
		for (let k = 0; k < 12; k++) {
			const a = k * Math.PI / 6;
			ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
		}
		const g = ctx.createConicGradient ? ctx.createConicGradient(sweep - 0.9, cx, cy) : null;
		if (g) {
			g.addColorStop(0, "rgba(51,255,166,0)"); g.addColorStop(0.143, "rgba(51,255,166,0.22)"); g.addColorStop(0.1431, "rgba(51,255,166,0)"); g.addColorStop(1, "rgba(51,255,166,0)");
			ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, sweep - 0.9, sweep); ctx.closePath(); ctx.fill();
		}
		ctx.strokeStyle = "rgba(160,255,210,0.7)"; ctx.lineWidth = 1.5;
		ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(sweep) * R, cy + Math.sin(sweep) * R); ctx.stroke();
		if (!still && Math.random() < dt * 0.9) spawn();
		for (const b of blips) {
			if (!still) b.r -= b.v * dt;
			const diff = ((sweep - b.a) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
			if (diff < 0.08) b.seen = 1;
			b.seen = Math.max(0, b.seen - dt * 0.45);
			const x = cx + Math.cos(b.a) * b.r, y = cy + Math.sin(b.a) * b.r;
			const col = b.kind === 0 ? "255,191,64" : b.kind === 1 ? "255,90,74" : "255,120,255";
			ctx.fillStyle = "rgba(" + col + "," + (0.15 + b.seen * 0.85) + ")";
			ctx.beginPath(); ctx.arc(x, y, b.kind === 0 ? 3 : 4, 0, Math.PI * 2); ctx.fill();
			if (b.seen > 0.5 && !b.targeted && b.r < R * 0.6 && Math.random() < dt * 1.5) {
				b.targeted = true; shots.push({ x: cx, y: cy, b, life: 3 });
			}
			if (b.r < 12) b.alive = false;
		}
		for (const s of shots) {
			if (!s.b.alive) { s.life = 0; continue; }
			const tx = cx + Math.cos(s.b.a) * s.b.r, ty = cy + Math.sin(s.b.a) * s.b.r;
			const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy);
			const sp = 260 * dt;
			const nx = s.x + dx / (d || 1) * Math.min(sp, d), ny = s.y + dy / (d || 1) * Math.min(sp, d);
			ctx.strokeStyle = "rgba(90,216,255,0.85)"; ctx.lineWidth = 2;
			ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(nx, ny); ctx.stroke();
			s.x = nx; s.y = ny; s.life -= dt;
			if (d < 6) {
				s.b.alive = false; s.life = 0;
				ctx.fillStyle = "rgba(255,230,150,0.9)"; ctx.beginPath(); ctx.arc(tx, ty, 10, 0, Math.PI * 2); ctx.fill();
			}
		}
		for (let i = blips.length - 1; i >= 0; i--) if (!blips[i].alive) blips.splice(i, 1);
		for (let i = shots.length - 1; i >= 0; i--) if (shots[i].life <= 0) shots.splice(i, 1);
		if (!still) requestAnimationFrame(frame);
	}
	resize();
	window.addEventListener("resize", resize);
	requestAnimationFrame(frame);
})();

lang = pickLang();
applyLang();
